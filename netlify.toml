[build]
  publish = "."
  command = "node scripts/build-version.js"

# ── Cache control ────────────────────────────────────────────────────────────
# HTML and version.json must always be revalidated so users get new versions
# without a hard refresh. Static assets can cache freely.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Canonical host: redirect www → apex ───────────────────────────────────────
[[redirects]]
  from = "https://www.vendora.site/*"
  to   = "https://vendora.site/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
