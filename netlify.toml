[build]
  publish = "."
  command = "node scripts/build-version.js"

# Server-rendered public guides use the existing backend's collected data.
[[redirects]]
  from = "/price-guides"
  to = "https://vendora-production-8a47.up.railway.app/public/price-guides"
  status = 200

[[redirects]]
  from = "/price-guides/"
  to = "/price-guides"
  status = 301

[[redirects]]
  from = "/price-guides/*"
  to = "https://vendora-production-8a47.up.railway.app/public/price-guides/:splat"
  status = 200

# ── Cache control ────────────────────────────────────────────────────────────
# HTML and version.json must always be revalidated so users get new versions
# without a hard refresh. Static assets can cache freely.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Canonical host: redirect www → apex ───────────────────────────────────────
[[redirects]]
  from = "https://www.vendora.site/*"
  to   = "https://vendora.site/:splat"
  status = 301
  force  = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
